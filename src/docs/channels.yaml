paths:
  /channels/{channelId}/join:
    post:
      summary: Join a channel
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Already a member of the channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      alreadyMember: { type: boolean, example: true }
        201:
          description: Successfully joined the channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      alreadyMember: { type: boolean, example: false }
        401:
          description: Missing, malformed or invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        404:
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /channels/{channelId}/messages:
    get:
      summary: List messages in a channel
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: integer }
        - in: query
          name: before
          required: false
          schema: { type: string, format: date-time }
          description: Only return messages created before this timestamp
      responses:
        200:
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        401:
          description: Missing, malformed or invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        403:
          description: Not a member of the channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        404:
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Send a message to a channel
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, example: Hello everyone! }
      responses:
        201:
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data: { $ref: "#/components/schemas/Message" }
        400:
          description: Validation error (missing/too long message body)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        401:
          description: Missing, malformed or invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        403:
          description: Not a member of the channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        404:
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
